<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Tech Geometric Monogram ITC -->
  <!-- "I" Bar -->
  <rect x="13" y="18" width="5.5" height="28" rx="2.75" fill="#ffffff" filter="url(#shadow)"/>

  <!-- "T" Bar -->
  <path d="M23 18h18c1.5 0 2.5 1 2.5 2.5s-1 2.5-2.5 2.5h-6.25v20.5c0 1.5-1.12 2.5-2.75 2.5s-2.75-1-2.75-2.5V23H23c-1.5 0-2.5-1-2.5-2.5S21.5 18 23 18z" fill="#ffffff" filter="url(#shadow)"/>

  <!-- "C" Arc with Access Dot -->
  <path d="M51 24.5c-1.2-1.2-3.1-1.2-4.3 0-4.5 4.5-4.5 11.5 0 16 1.2 1.2 3.1 1.2 4.3 0 1.2-1.2 1.2-3.1 0-4.3-2.1-2.1-2.1-5.5 0-7.6 1.2-1.2 1.2-3 0-4.1z" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Glowing Digital Connection Node -->
  <circle cx="51" cy="18" r="3" fill="#38bdf8"/>
  <circle cx="51" cy="18" r="5.5" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
</svg>

